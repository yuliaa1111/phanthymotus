# TTS benchmark deployment: each of the three replicas loads only Serena.
# MCP_PORT and WS_PORT are assigned independently by the evaluation platform.
mcp_port: 15720
ws_port: 15721
plugins:
  tts:
    enabled: true
    engine: serena-zh-en
    model_dir: /models/serena
    device: gpu
    language: auto
    speed: 1.0
    warmup: true
    serena_vocoder_backend: ort-cuda
  echo_cancellation:
    enabled: false
  audio_mixer:
    enabled: false
